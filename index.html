function haversineMeters(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const la1=a.lat*r, la2=b.lat*r;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function resetGpsReference(pos){
  gpsLast={lat:pos.lat,lon:pos.lon,t:performance.now(),accuracy:pos.accuracy};
}
function gpsDistanceKm(){return gpsTotalMeters/1000}

  if(!gpsLost){gpsLost=true;setStatus('GPS LOST');}
}
function markGpsRecovered(accuracy){
  gpsLost=false;
  setStatus(`GPS ±${Math.round(accuracy)}m`);
}
function handleGpsPosition(pos){
  const now=performance.now(), c=pos.coords;
  const accuracy=Number.isFinite(c.accuracy)&&c.accuracy>0?c.accuracy:999;
  const speed=Number.isFinite(c.speed)&&c.speed>=0?c.speed*3.6:0;
  lastTs={lat:c.latitude,lon:c.longitude,t:now,speed};
  gpsSampleCount++;

  if(!gpsActive){
    gpsActive=true;
    gpsDistance=gpsDistanceKm();
    resetGpsReference({lat:c.latitude,lon:c.longitude,accuracy});
    markGpsRecovered(accuracy);
    display();
    return;
  }

  const current={lat:c.latitude,lon:c.longitude,t:now,accuracy};
  if(!gpsLast){
    resetGpsReference(current);
    markGpsRecovered(accuracy);
    display();
    return;
  }

  // Poor fixes are not allowed to become distance anchors.
  if(accuracy>GPS_MAX_ACCURACY){
    markGpsLost();
    display();
    return;
  }

  const dt=(now-gpsLast.t)/1000;
  if(dt<=0)return;
  if(dt>GPS_MAX_RECOVERY_GAP_SEC){
    // Too long to make a safe distance estimate: re-anchor instead of guessing.
    resetGpsReference(current);
    markGpsRecovered(accuracy);
    display();
    return;
  }

  const meters=haversineMeters(gpsLast,current);
  const impliedKmh=(meters/dt)*3.6;

  if(impliedKmh<=GPS_MAX_SPEED_KMH){
    // During a GPS outage (e.g. tunnel), the direct distance from the last good
    // fix to the first good fix is counted once when GPS returns.
    if(stageStarted && running && meters>=GPS_MIN_MOVE_M){
      gpsTotalMeters+=meters;
      gpsDistance=gpsDistanceKm();
    }
    gpsLast=current;
    markGpsRecovered(accuracy);
  }else{
    // Reject the jump and use the new good fix as the next anchor.
    gpsLast=current;
    markGpsLost();
  }

}
function startGps(){

let compassOn=false;
let compassHandler=null;
function screenAngle(){
  const w=Number(window.orientation);
  if(w===90||w===-90||w===0||w===180) return w;
  const a=Number(screen.orientation?.angle);
  if(a===90) return 90;
  if(a===270) return -90;
  if(a===180) return 180;
  return 0;
}
function normalizeHeading(h){return (h%360+360)%360}
$('compassBtn').onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent==='undefined'){setStatus('コンパス非対応');return}
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){setStatus('コンパス許可が必要');return}
    }
    if(compassOn)return;
    compassOn=true;
    compassHandler=e=>{
      let h=null;
      if(typeof e.webkitCompassHeading==='number' && e.webkitCompassHeading>=0){
        // iPhone Safari: webkitCompassHeading is magnetic heading.
        // Convert the device's portrait reference to the current screen top.
        h=normalizeHeading(e.webkitCompassHeading + screenAngle());
      }else if(typeof e.alpha==='number'){
        // Non-iOS fallback. alpha is clockwise around the device Z axis.
        h=normalizeHeading(360-e.alpha-screenAngle());
      }
      if(h!=null){
        const acc=(typeof e.webkitCompassAccuracy==='number'&&e.webkitCompassAccuracy>=0)?Math.round(e.webkitCompassAccuracy):null;
        setStatus('CAP '+Math.round(h)+'°'+(acc!=null?' ±'+acc+'°':''));
      }
    };
    window.addEventListener('deviceorientation',compassHandler,{passive:true});
    setStatus('CAP ON');
  }catch(err){setStatus('CAP開始失敗')}
};

async function resumeFromBackground(){
  if(!running)return;

  if(gpsUserEnabled&&gpsWatchId===null)startGps();

      pos=>{resumeFixPending=false;handleGpsPosition(pos);},
      ()=>{resumeFixPending=false;markGpsLost();},

  }else{
    resumeFixPending=false;
